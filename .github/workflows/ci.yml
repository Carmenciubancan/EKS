name: CI validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_PATH: java-maven-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build app
        run: mvn -q -f "$APP_PATH/pom.xml" -DskipTests package

      - name: Build ECR Docker image locally
        run: docker build -f "CD to cluster - ecr/Dockerfile" -t java-maven-app:ecr-ci "$APP_PATH"

      - name: Build DockerHub Docker image locally
        run: docker build -f "CD to cluster - dockerhub/Dockerfile" -t java-maven-app:dockerhub-ci "$APP_PATH"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate ECR Kubernetes manifests
        run: |
          kubectl apply --dry-run=client --validate=false -f "CD to cluster - ecr/k8s/namespace.yaml"
          kubectl apply --dry-run=client --validate=false -f "CD to cluster - ecr/k8s/service.yaml"
          sed "s|IMAGE_PLACEHOLDER|example.com/java-maven-app:ci|g" "CD to cluster - ecr/k8s/deployment.yaml" \
            | kubectl apply --dry-run=client --validate=false -f -

      - name: Validate DockerHub Kubernetes manifests
        run: |
          kubectl apply --dry-run=client --validate=false -f "CD to cluster - dockerhub/k8s/namespace.yaml"
          kubectl apply --dry-run=client --validate=false -f "CD to cluster - dockerhub/k8s/service.yaml"
          sed "s|IMAGE_PLACEHOLDER|example/java-maven-app:ci|g" "CD to cluster - dockerhub/k8s/deployment.yaml" \
            | kubectl apply --dry-run=client --validate=false -f -
