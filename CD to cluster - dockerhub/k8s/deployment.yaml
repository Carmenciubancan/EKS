apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-maven-app
  namespace: demo
  labels:
    app: java-maven-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-maven-app
  template:
    metadata:
      labels:
        app: java-maven-app
    spec:
      containers:
        - name: java-maven-app
          # Replaced by the workflow with the built image tag
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
